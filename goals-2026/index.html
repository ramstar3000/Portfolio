    <script>
        // Initialize all cards
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.goal-card').forEach(card => {
                const script = card.querySelector('script[type="text/markdown"]');
                const contentDiv = card.querySelector('.markdown-content');
                if (script && contentDiv) {
                    // Clean indentation from the template literal
                    let rawMarkdown = script.innerHTML;

                    // Remove common leading whitespace to fix indentation issues
                    const lines = rawMarkdown.split('\n');
                    const minIndent = lines
                        .filter(l => l.trim())
                        .reduce((min, l) => {
                            const indent = l.match(/^\s*/)[0].length;
                            return Math.min(min, indent);
                        }, Infinity);

                    if (minIndent !== Infinity) {
                        rawMarkdown = lines.map(l => l.substring(minIndent)).join('\n');
                    }

                    // Render markdown
                    contentDiv.innerHTML = marked.parse(rawMarkdown);
                }
            });
        });

        function toggleCard(card) {
            // Close other cards
            document.querySelectorAll('.goal-card.expanded').forEach(c => {
                if (c !== card) c.classList.remove('expanded');
            });

            // Toggle current card
            card.classList.toggle('expanded');
        }
    </script>
