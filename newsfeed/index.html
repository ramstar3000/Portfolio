<!doctype html>
<html lang="en-GB">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newsfeed | Abhiram Vinjamuri</title>
    <meta name="description" content="Access Abhiram Vinjamuri's private newsfeed for the latest updates and personal projects.">

    <!-- Fonts -->
    <link rel='stylesheet'
        href='https://fonts.googleapis.com/css?family=Space+Grotesk%3A100%2C100italic%2C200%2C200italic%2C300%2C300italic%2C400%2C400italic%2C500%2C500italic%2C600%2C600italic%2C700%2C700italic%2C800%2C800italic%2C900%2C900italic%7CLexend%3A100%2C100italic%2C200%2C200italic%2C300%2C300italic%2C400%2C400italic%2C500%2C500italic%2C600%2C600italic%2C700%2C700italic%2C800%2C800italic%2C900%2C900italic&#038;display=swap&#038;ver=6.5.5'
        media='all' />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/box.css">
    <link rel="stylesheet" href="../css/style.css">

    <!-- Crypto JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .nav-link {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        /* Auth UI */
        #auth-ui {
            text-align: center;
            padding: 40px;
            background: #f9f9f9;
            border-radius: 16px;
            border: 1px solid #eee;
        }

        input[type="password"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }

        button {
            padding: 10px 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
        }

        button:hover {
            background: #000;
        }

        .error {
            color: red;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="../" class="nav-link">← Back to Home</a>
        <h1>Abhiram Vinjamuri's Private Newsfeed</h1>

        <!-- Auth Screen -->
        <div id="auth-ui">
            <h2>Restricted Access</h2>
            <p>Please enter the password to view the newsfeed.</p>
            <div style="display:flex; justify-content:center; gap:10px; margin-top:20px;">
                <input type="password" id="password-input" placeholder="Password"
                    onkeyup="if(event.key === 'Enter') unlock()">
                <button onclick="unlock()">Access Newsfeed</button>
            </div>
            <div id="error-msg" class="error">Incorrect password</div>
        </div>

        <!-- Content Container (Hidden by default) -->
        <div id="content-display" style="display:none;"></div>
    </div>

    <script>
        // Content: <h1>Latest Updates</h1><p>Welcome to the secure/private newsfeed!</p>

        // --- SECURITY WARNING ---
        // This uses Client-Side AES (Symmetric Encryption). 
        // 1. It is "Secure" in that the content is unreadable without the password.
        // 2. However, it is NOT "Production Grade Auth" because all users share the SAME password.
        // 3. If one user leaks the password, EVERYONE has access.
        // 4. Ideally, use server-side auth (OAuth/SAML) for true production security.
        // ------------------------

        const encryptedData = "U2FsdGVkX18jOJhU6hmVIHs+3kVpmdAkq/O24W1wwv6jqpFkA1dqrtFToMbN8tez5glR3sCBdU4I8zM+WAKxIEZBy8ZLO+ORkltFY8tA0TTCIIrcWMZXafV4E8Xk8i6o";
        // hint: youwont'tguessme


        function unlock() {
            const pass = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                // Attempt decrypt
                const decryptedBytes = CryptoJS.AES.decrypt(encryptedData, pass);
                const decryptedText = decryptedBytes.toString(CryptoJS.enc.Utf8);

                if (decryptedText) {
                    // Success
                    document.getElementById('auth-ui').style.display = 'none';
                    const display = document.getElementById('content-display');
                    display.style.display = 'block';
                    display.innerHTML = decryptedText;
                } else {
                    // Fail (empty result means wrong pass usually)
                    throw new Error("Empty decryption");
                }
            } catch (e) {
                errorMsg.style.display = 'block';
                // Shake animation
                const input = document.getElementById('password-input');
                input.style.borderColor = 'red';
                setTimeout(() => input.style.borderColor = '#ccc', 500);
            }
        }
    </script>
</body>

</html>
